[package]
name = "dubly-desktop"
version = "0.1.0"
description = "AI Real-Time Dubbing & Live Translation Desktop App"
authors = ["Dubly Open Source Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = ["tray-icon"] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["connect", "native-tls"] }
futures-util = "0.3"
native-tls = "0.2"
cpal = "0.15"
base64 = "0.22"
sysinfo = "0.31"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
tracing = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
